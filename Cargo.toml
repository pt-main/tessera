[package]
name = "tessera"
version = "1.0.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
compact_str = "0.10.0"
hashbrown = "0.17.1"
rustc-hash = "2.1.3"
tap-rs = "1.14.15"
unescape_zero_copy = "2.4.0"

[lib]
name = "tessera" 
path = "src/lib/mod.rs"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.release.package."*"]
opt-level = 3
